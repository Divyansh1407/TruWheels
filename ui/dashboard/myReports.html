<!DOCTYPE html>
<html>

<head>

    <title>My Reports | TruWheels</title>

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <link
    rel="stylesheet"
    href="myReports.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <div class="brand">

            <a href="../home/home.html"
            class="back-btn">

                ←

            </a>

            <img
            src="../../images/branding/logo.png"
            alt="TruWheels"
            class="logo">

            <div class="brand-text">

                <h2>
                    <span class="tru">Tru</span><span class="wheels">Wheels</span>
                </h2>

            </div>

        </div>

    </header>


    <!-- ================= MAIN WRAPPER ================= -->

    <main class="dashboard-wrapper">

        <div class="dashboard-container">

            <!-- HEADER -->

            <header class="dashboard-header">

                <h1 class="dashboard-title">

                    My Reports

                </h1>

                <p class="dashboard-subtitle">

                    Access, manage and revisit all your saved vehicle reports.

                </p>

            </header>


            <!-- STATS SECTION -->

            <section class="stats-section">

                <div class="stat-card">

                    <h2 id="totalReports">
                        0
                    </h2>

                    <p>
                        Total Reports
                    </p>

                </div>


                <div class="stat-card">

                    <h2 id="bestScore">
                        --
                    </h2>

                    <p>
                        Best Health Score
                    </p>

                </div>


                <div class="stat-card">

                    <h2 id="recentReport">
                        --
                    </h2>

                    <p>
                        Latest Report
                    </p>

                </div>

            </section>


            <!-- REPORTS SECTION -->

            <section class="reports-section">

                <h2 class="section-title">

                    Saved Reports

                </h2>

                <div class="search-wrapper">

                    <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search by brand or model">

                </div>

                <div id="reportsContainer">

                    <!-- Dynamic Report Cards -->

                </div>

            </section>

        </div>

    </main>


    <script type="module"
    src="myReports.js"></script>

</body>

</html>
