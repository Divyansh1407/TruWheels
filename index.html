<!DOCTYPE html>
<html>

<head>
  <title>TruWheels</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-header">

      <div class="brand">

          <a
          href="home.html"
          class="back-btn"
          >
              ←
          </a>

          <img
          src="images/branding/logo.png"
          alt="TruWheels"
          class="logo">

          <div class="brand-text">
              <h2>
                  <span class="tru">Tru</span><span class="wheels">Wheels</span>
              </h2>

          </div>

      </div>

  </header>

  <div class="main-container">

  <div class="container">

    <h2 class="page-title">
      Vehicle Assessment Input
    </h2>

    <p class="subtitle">
      Enter vehicle details to generate a complete TruWheels report.
    </p>

    <div class ="info-card">

      <h3 class="section-title">
        Vehicle Details
      </h3>

      <div class="form-grid">

      <select id="carBrand">

  <option value="">
    Select Brand
  </option>

  <option value="Maruti">
    Maruti
  </option>

  <option value="Hyundai">
    Hyundai
  </option>

  <option value="Tata">
    Tata
  </option>

  <option value="Mahindra">
    Mahindra
  </option>

  <option value="Honda">
    Honda
  </option>

  <option value="Kia">
    Kia
  </option>

  <option value="Volkswagen">
    Volkswagen
  </option>

  <option value="Skoda">
    Skoda
  </option>

  <option value="Renault">
    Renault
  </option>

  <option value="MG">
    MG
  </option>

  <option value="Ford">
    Ford
  </option>

  <option value="Toyota">
    Toyota
  </option>

</select>

      <select id="carModel">
       <option value="">
         Select Model
            </option>
       </select>

<select id="engineType">
  <option value="">
    Select Engine Type
  </option>

  <option value="Petrol">
    Petrol
  </option>

  <option value="Diesel">
    Diesel
  </option>

  <option value="CNG">
    CNG
  </option>
</select>

<select id="transmission">

  <option value="">
    Select Transmission
  </option>

  <option value="Manual">
    Manual
  </option>

  <option value="Automatic">
    Automatic
  </option>

</select>
      </div>
      </div>

    
      <div class="info-card">
    <h3 class="section-title">
      Vehicle Information
    </h3>
    <div class="form-grid">

      <input
        type="number"
        id="year"
        placeholder="Manufacturing Year"
      >

      <input
        type="number"
        id="km"
        placeholder="Kilometers Driven"
      >

      <input
        type="number"
        id="owners"
        placeholder="Number of Owners"
      >

      <input
        type="number"
        id="price"
        placeholder="Asking Price"
      >
      </div>
      </div>

      <div class="service-section">

      <div class="service-header">

      <div class="service-text">

          <h4>
           SERVICE INTELLIGENCE (OPTIONAL)
          </h4>

          <p>
           Add service details if you have them for more accurate insights
          </p>

      </div>

          <span id="service-arrow">
              ▼
          </span>

      </div>

      <div class="service-content">

      <div class="service-grid">

          <select id="serviceHistory">
              <option value="">Service History</option>
              <option value="Full">Full Service History</option>
              <option value="Partial">Partial Service History</option>
              <option value="None">No Service Records</option>
          </select>

          <select id="serviceType">
              <option value="">Service Type</option>
              <option value="Authorized">Authorized Service Center</option>
              <option value="Mixed">Mixed Service History</option>
              <option value="Local">Local Garage Maintained</option>
          </select>

          <select id="accidentHistory">
              <option value="">Accident History</option>
              <option value="None">No Accident History</option>
              <option value="Minor">Minor Repairs</option>
              <option value="Major">Major Structural Repair</option>
          </select>

          <select id="maintenanceDiscipline">
              <option value="">Maintenance Discipline</option>
              <option value="Excellent">Always Serviced On Time</option>
              <option value="Average">Occasionally Delayed</option>
              <option value="Poor">Poorly Maintained</option>
          </select>

       </div>

    </div>


      <button onclick="analyzeCar()">
        Generate Report
      </button>
  </div>

      <p class="security-note">
        🛡️ 100% Secure • Private • Instant Report
      </p>

    </div>
  </div>
  </div>
  <script src="data/carDatabase.js"></script>
  <script src="data/maintenanceGuide.js"></script>
  <script type="module" src="script.js"></script>
  <script src="ui/serviceToggle.js"></script>

</body>

</html>
